<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CaseCraft | Phone Cases</title>
  
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
    <link rel="stylesheet" href="style.css">
</head>
<body>


    <header>
        <div class="nav-container">
            <a href="#" class="logo" onclick="changePage('home')">CASECRAFT</a>
            <nav>
                <button class="nav-btn active" id="nav-home" onclick="changePage('home')">Home</button>
                <button class="nav-btn" id="nav-catalog" onclick="changePage('catalog')">Shop</button>
                <button class="nav-btn" id="nav-cart" onclick="changePage('cart')">Cart (<span id="cart-count">0</span>)</button>
            </nav>
        </div>
    </header>

    <div class="container">
   
        <section id="page-home" class="page active">
            <div class="hero-section">
                <h1>Protect Your Phone in Style</h1>
                <p>We sell strong, shockproof phone cases for iPhone and Samsung. Built to last.</p>
                <button class="btn" onclick="changePage('catalog')">Shop Now</button>
            </div>
        </section>

        <section id="page-catalog" class="page">
            <h2>All Phone Cases</h2>
            <div class="products-grid" id="product-list">
                <!-- Products load here using JavaScript -->
            </div>
        </section>

       
        <section id="page-cart" class="page">
            <h2>Shopping Cart</h2>
            <div id="cart-items">
                <!-- Cart items load here -->
            </div>
            <div class="cart-total">
                <h3>Total: $<span id="total-price">0.00</span></h3>
                <button class="btn" onclick="checkout()">Checkout</button>
            </div>
        </section>

    </div>

    <footer>
        <p>&copy; 2026 CaseCraft Shop</p>
    </footer>

    <!-- JavaScript File -->
    <script src="script.js"></script>
</body>
</html>
